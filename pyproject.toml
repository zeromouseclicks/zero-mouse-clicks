[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-mouse-clicks"
version = "0.2.1"
description = "Architectural plan sets (PDF) from a marketing floor-plan image, with small on-device models and rules. No cloud API."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Zero Mouse Clicks contributors"}]
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "onnxruntime>=1.17",
  "reportlab>=4.0",
]
keywords = ["floor plan", "architecture", "AEC", "BIM", "segmentation", "onnx", "computer vision"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.optional-dependencies]
train = ["tensorflow>=2.15", "tf2onnx", "onnx", "onnxconverter-common"]

[project.scripts]
zmc = "zmc.__main__:main"

[project.urls]
Homepage = "https://github.com/zeromouseclicks/zero-mouse-clicks"

[tool.setuptools]
packages = ["zmc"]

[tool.setuptools.package-data]
zmc = ["models/*.onnx"]
